<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 312" width="720" height="312" role="img" aria-labelledby="t d">
  <title id="t">Each LoRA adapter against its own base model</title>
  <desc id="d">Mean fitness on held-out tasks, base model then base model with the adapter: reviewer 0.724 to 0.876, accepted; tester 0.776 to 0.877, accepted; editor 0.999 to 0.998, rejected; navigator 0.799 to 0.798, rejected.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tick { font-size: 11px; fill: #898781; font-variant-numeric: tabular-nums; }
    .name { font-size: 13px; font-weight: 600; fill: #f0efec; }
    .num { font-size: 12px; fill: #f0efec; font-variant-numeric: tabular-nums; }
    .verdict { font-size: 12px; fill: #c3c2b7; }
    .key { font-size: 12px; fill: #c3c2b7; }
  </style>
  <rect x=".5" y=".5" width="719" height="311" rx="12" fill="#1a1a19" stroke="rgba(255,255,255,0.10)"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#f0efec">Each LoRA adapter against its own base model</text>
  <text x="24" y="54" font-size="12" fill="#c3c2b7">Mean fitness on held-out tasks. An adapter is kept only if it beats its base.</text>

  <circle cx="30" cy="78" r="5" fill="#184f95"/>
  <text class="key" x="42" y="82">base model</text>
  <circle cx="132" cy="78" r="5" fill="#3987e5"/>
  <text class="key" x="144" y="82">base model with the adapter</text>

  <g stroke="#2c2c2a" stroke-width="1">
    <path d="M124 98V268"/>
    <path d="M206 98V268"/>
    <path d="M288 98V268"/>
    <path d="M370 98V268"/>
    <path d="M452 98V268"/>
  </g>
  <path d="M124 268H452" stroke="#383835" stroke-width="1"/>
  <text class="tick" x="124" y="285" text-anchor="middle">0.6</text>
  <text class="tick" x="206" y="285" text-anchor="middle">0.7</text>
  <text class="tick" x="288" y="285" text-anchor="middle">0.8</text>
  <text class="tick" x="370" y="285" text-anchor="middle">0.9</text>
  <text class="tick" x="452" y="285" text-anchor="middle">1.0</text>

  <text class="name" x="24" y="122">reviewer</text>
  <path d="M225.8 118H350.3" stroke="#383835" stroke-width="2" stroke-linecap="round"/>
  <circle cx="225.8" cy="118" r="5" fill="#184f95" stroke="#1a1a19" stroke-width="2"/>
  <circle cx="350.3" cy="118" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
  <text class="num" x="480" y="122">0.724 → 0.876</text>
  <text class="verdict" x="590" y="122">accepted</text>
  <text class="name" x="24" y="162">tester</text>
  <path d="M268.1 158H351.1" stroke="#383835" stroke-width="2" stroke-linecap="round"/>
  <circle cx="268.1" cy="158" r="5" fill="#184f95" stroke="#1a1a19" stroke-width="2"/>
  <circle cx="351.1" cy="158" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
  <text class="num" x="480" y="162">0.776 → 0.877</text>
  <text class="verdict" x="590" y="162">accepted</text>
  <text class="name" x="24" y="202">editor</text>
  <path d="M450.9 198H450.2" stroke="#383835" stroke-width="2" stroke-linecap="round"/>
  <circle cx="450.9" cy="198" r="5" fill="#184f95" stroke="#1a1a19" stroke-width="2"/>
  <circle cx="450.2" cy="198" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
  <text class="num" x="480" y="202">0.999 → 0.998</text>
  <text class="verdict" x="590" y="202">rejected</text>
  <text class="name" x="24" y="242">navigator</text>
  <path d="M287 238H286.4" stroke="#383835" stroke-width="2" stroke-linecap="round"/>
  <circle cx="287" cy="238" r="5" fill="#184f95" stroke="#1a1a19" stroke-width="2"/>
  <circle cx="286.4" cy="238" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
  <text class="num" x="480" y="242">0.799 → 0.798</text>
  <text class="verdict" x="590" y="242">rejected</text>
</svg>
